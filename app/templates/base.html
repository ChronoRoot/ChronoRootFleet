<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoRoot Fleet Master</title>

    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">

    <style>
        /* ==========================================
           1. GLOBAL TYPOGRAPHY & BASE COLORS
           ========================================== */
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fc; /* Softer, modern background */
            color: #2c3e50; 
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }

        /* ==========================================
           2. THE DE-CRAMPING RULES (Icons)
           ========================================== */
        i.fas, i.far, i.fab { 
            /* Forces a global buffer between EVERY icon and the text next to it */
            margin-right: 6px; 
            margin-left: 2px;
        }
        
        /* Exception for icons that are alone (like in close buttons) */
        i:only-child { margin-right: 0; margin-left: 0; }

        /* ==========================================
           3. GLOBAL COMPONENT REFINEMENTS
           ========================================== */
        /* Buttons become flex containers to perfectly space text and icons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        
        /* Override for perfectly centered buttons */
        .btn i.fas, .btn i.far { margin-right: 4px; } 

        .badge {
            font-weight: 600;
            letter-spacing: 0.3px;
            padding: 0.45em 0.75em;
        }

        /* ==========================================
           4. NAVBAR STYLING
           ========================================== */
        .navbar-brand { 
            font-weight: 700; 
            letter-spacing: 0.5px; 
        }
        .nav-link { 
            font-weight: 600; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            color: rgba(255,255,255,0.7) !important;
            transition: color 0.2s ease;
        }
        .nav-link:hover { color: #fff !important; }
        .nav-link.active { color: #4e73df !important; } /* Modern SaaS Blue */
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/"><i class="fas fa-robot text-primary"></i> ChronoRoot Fleet</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-3">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="fas fa-network-wired"></i> All Modules
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/experiments' %}active{% endif %}" href="/experiments">
                        <i class="fas fa-flask"></i> Experiment Status
                    </a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="/about">
                        <i class="fas fa-info-circle"></i> About
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    {% block content %}{% endblock %}
</div>


<!-- TOAST (Standardized & Requires Acknowledgment) -->
<div class="toast-container position-fixed top-50 start-50 translate-middle p-3" style="z-index: 1090;">
    <div id="appToast" class="toast text-dark border shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header bg-light text-dark border-bottom">
            <i id="toastIcon" class="fas fa-info-circle me-2"></i>
            <strong class="me-auto" id="toastTitle">Notification</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body bg-white text-center py-4">
            <div id="toastMessage" class="mb-4" style="font-size: 1.05rem;"></div>
            <div>
                <button type="button" class="btn btn-dark px-5 font-weight-bold" data-bs-dismiss="toast">Accept</button>
            </div>
        </div>
    </div>
</div>

<!-- CONFIRM MODAL (Neutral, Standard UI) -->
<div class="modal fade" id="customConfirmModal" tabindex="-1" aria-hidden="true" style="z-index: 1080;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow border-0">
      <div class="modal-header bg-light text-dark border-bottom py-3">
        <h5 class="modal-title" id="confirmModalTitle">Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-4 text-center bg-white" style="font-size: 1.05rem;" id="confirmModalBody">
        Are you sure?
      </div>
      <div class="modal-footer border-top bg-light justify-content-center py-2">
        <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-dark px-4" id="confirmModalBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- PROMPT MODAL (Neutral, Standard UI) -->
<div class="modal fade" id="customPromptModal" tabindex="-1" aria-hidden="true" style="z-index: 1080;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow border-0">
      <div class="modal-header bg-light text-dark border-bottom py-3">
        <h5 class="modal-title" id="promptModalTitle">Input Required</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-4 bg-white">
        <label id="promptModalLabel" class="form-label font-weight-bold text-dark small"></label>
        <input type="text" class="form-control shadow-sm" id="promptModalInput">
      </div>
      <div class="modal-footer border-top bg-light py-2">
        <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-dark px-4" id="promptModalBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
    // --- GLOBAL UI ENGINE ---
    
    // Replaces alert() - Now persists until acknowledged
    function showToast(message, type = 'success') {
        const toastEl = document.getElementById('appToast');
        const toastTitle = document.getElementById('toastTitle');
        const toastMsg = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');
        
        // Minimal coloring via icons, keeping the box neutral
        if (type === 'danger') {
            toastIcon.className = 'fas fa-exclamation-circle text-danger me-2';
            toastTitle.innerText = 'Alert';
        } else if (type === 'warning') {
            toastIcon.className = 'fas fa-exclamation-triangle text-warning me-2';
            toastTitle.innerText = 'Warning';
        } else if (type === 'success') {
            toastIcon.className = 'fas fa-check-circle text-success me-2';
            toastTitle.innerText = 'Success';
        } else {
            toastIcon.className = 'fas fa-info-circle text-secondary me-2';
            toastTitle.innerText = 'Information';
        }

        toastMsg.innerHTML = message;
        
        // autohide: false forces the user to click "Acknowledge" or the close button
        const bsToast = new bootstrap.Toast(toastEl, { autohide: false });
        bsToast.show();
    }

    // Replaces confirm() - Returns a Promise (true/false)
    function asyncConfirm(title, message, isDanger = false) {
        return new Promise((resolve) => {
            document.getElementById('confirmModalTitle').innerHTML = title;
            document.getElementById('confirmModalBody').innerHTML = message;
            
            const btn = document.getElementById('confirmModalBtn');
            // Use standard dark for normal confirm, danger red only if strictly necessary
            btn.className = `btn px-4 ${isDanger ? 'btn-danger' : 'btn-dark'}`;
            
            const modalEl = document.getElementById('customConfirmModal');
            const bsModal = new bootstrap.Modal(modalEl);
            
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.addEventListener('click', () => {
                bsModal.hide();
                resolve(true);
            });
            
            modalEl.addEventListener('hidden.bs.modal', function handler() {
                modalEl.removeEventListener('hidden.bs.modal', handler);
                resolve(false); 
            });
            
            bsModal.show();
        });
    }

    // Replaces prompt() - Returns a Promise (string or null)
    function asyncPrompt(title, label, defaultValue = '') {
        return new Promise((resolve) => {
            document.getElementById('promptModalTitle').innerHTML = title;
            document.getElementById('promptModalLabel').innerHTML = label;
            
            const input = document.getElementById('promptModalInput');
            input.value = defaultValue;
            
            const btn = document.getElementById('promptModalBtn');
            const modalEl = document.getElementById('customPromptModal');
            const bsModal = new bootstrap.Modal(modalEl);
            
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            input.onkeypress = function(e) {
                if (e.key === 'Enter') newBtn.click();
            };

            newBtn.addEventListener('click', () => {
                bsModal.hide();
                resolve(input.value.trim());
            });
            
            modalEl.addEventListener('hidden.bs.modal', function handler() {
                modalEl.removeEventListener('hidden.bs.modal', handler);
                resolve(null); 
            });
            
            bsModal.show();
            setTimeout(() => input.focus(), 500);
        });
    }
</script>

<script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
