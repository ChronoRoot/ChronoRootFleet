{% extends "base.html" %}

{% block content %}
<style>
    .batch-header { cursor: pointer; transition: background-color 0.2s ease; }
    .batch-header:hover { background-color: #f8f9fc; }
    .table-dense th, .table-dense td { padding: 0.8rem 1rem; vertical-align: middle; border-top: 1px solid #eaecf4; }
    .node-row { background-color: #fafbfc; border-left: 3px solid #4e73df; }
    .btn-delete-batch { z-index: 10; position: relative; }

    /* Keep the node row's blue accent border once it becomes a stacked card on
       narrow screens (the shared .table-responsive-cards rule sets all 4 border
       sides, so re-assert just the left one here). */
    @media (max-width: 991.98px) {
        .table-responsive-cards tbody tr.node-row {
            border-left: 3px solid #4e73df;
        }
    }
</style>

<div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="font-weight-bold mb-0"><i class="fas fa-flask text-primary"></i> Experiment Status</h2>
            <small class="text-muted">Experimental batches and historical biological runs.</small>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-outline-secondary font-weight-bold shadow-sm" onclick="loadExperiments()">
                <i class="fas fa-sync-alt"></i> Refresh Data
            </button>
            <button class="btn btn-primary font-weight-bold shadow-sm" id="btn-sync-archives" onclick="syncArchives()">
                <i class="fas fa-cloud-download-alt"></i> Sync Archive History
            </button>
            <button class="btn btn-danger font-weight-bold shadow-sm" onclick="purgeHistory()">
                <i class="fas fa-skull-crossbones"></i> Purge DB
            </button>
        </div>
    </div>

    <div class="card shadow-sm border-0 rounded overflow-hidden">
        <div class="card-header bg-white py-3 border-bottom d-none d-md-block">
            <div class="row font-weight-bold text-muted text-uppercase small" style="letter-spacing: 0.5px;">
                <div class="col-4">Experimental Batch Name</div>
                <div class="col-2">Launch Date</div>
                <div class="col-3">Global Progress</div>
                <div class="col-2">Status</div>
                <div class="col-1 text-right">Actions</div>
            </div>
        </div>
        
        <div id="loading-spinner" class="text-center py-5 text-muted">
            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i><br>Loading Experiments...
        </div>

        <div class="accordion accordion-flush" id="batchAccordion">
            </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function getOpenAccordions() {
        return Array.from(document.querySelectorAll('.accordion-collapse.show')).map(el => el.id);
    }

    async function loadExperiments() {
        const openIds = getOpenAccordions();
        
        // Show spinner safely
        const spinner = document.getElementById('loading-spinner');
        if (spinner) spinner.style.display = 'block';
        document.getElementById('batchAccordion').style.display = 'none';

        try {
            const res = await fetch('/api/fleet/db/experiments');
            
            if (!res.ok) {
                const textError = await res.text();
                throw new Error(`Server returned ${res.status}: ${textError}`);
            }
            
            const batchs = await res.json();
            
            if (spinner) spinner.style.display = 'none';
            const accordion = document.getElementById('batchAccordion');
            accordion.style.display = 'block';
            let html = '';

            batchs.forEach((batch, index) => {
                let p = batch.progress;
                let pct = p.expected > 0 ? Math.round((p.taken / p.expected) * 100) : 0;
                
                let badgeClass = 'bg-secondary';
                if (batch.global_status === 'RUNNING') badgeClass = 'bg-primary progress-bar-striped progress-bar-animated';
                if (batch.global_status === 'FINISHED') badgeClass = 'bg-success';
                if (batch.global_status === 'ERROR') badgeClass = 'bg-danger';

                let nodeRows = '';
                batch.nodes.forEach(node => {
                    let n_col = node.status === 'ERROR' ? 'text-danger' : (node.status === 'FINISHED' ? 'text-success' : 'text-primary');
                    
                    let nativeLink = node.ip && node.local_exp_id 
                        ? `<button onclick="window.location.href = '/remote/${node.mac}?dest=exp/${node.local_exp_id}'" class="btn btn-xs btn-outline-info py-0 px-2" style="font-size: 0.75rem;"><i class="fas fa-desktop"></i> View in Remote Proxy</button>` 
                        : `<span class="text-muted small">Offline</span>`;
                    
                    // FIX: Safe timeline parsing
                    let timeLine = (node.start_time && node.end_time) 
                        ? `${node.start_time.substring(5,16)} to ${node.end_time.substring(5,16)}` 
                        : 'Unknown Timeline';
                        
                    let msgHtml = node.message ? `<div class="small text-danger font-italic mt-1"><i class="fas fa-info-circle"></i> ${node.message}</div>` : '';

                    nodeRows += `
                        <tr class="node-row small">
                            <td class="pl-4 font-weight-bold text-dark w-25" data-label="Node">
                                <i class="fas fa-server text-muted mr-1"></i> ${node.hostname} 
                                <span class="text-secondary font-weight-normal font-italic ml-2" style="font-size: 0.70rem;">(${node.mac})</span>
                                ${msgHtml}
                            </td>
                            <td class="text-muted w-25" data-label="Timeline"><i class="far fa-clock"></i> ${timeLine}</td>
                            <td class="font-weight-bold ${n_col} w-15" data-label="Status">${node.status}</td>
                            <td class="w-20" data-label="Progress">${node.taken} / ${node.expected} imgs 
                                <span class="${node.missed > 0 ? 'text-danger font-weight-bold ml-2' : 'text-muted ml-2'}">${node.missed > 0 ? `(${node.missed} lost)` : ''}</span>
                            </td>
                            <td class="text-right pr-4 w-15" data-label="Remote">${nativeLink}</td>
                        </tr>
                    `;
                });

                let collapseId = `collapse${batch.id}`;
                let isOpen = openIds.includes(collapseId) ? 'show' : '';
                let isCollapsed = openIds.includes(collapseId) ? '' : 'collapsed';

                html += `
                <div class="accordion-item border-bottom">
                    <h2 class="accordion-header" id="heading${batch.id}">
                        <button class="accordion-button ${isCollapsed} batch-header bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
                            <div class="row w-100 align-items-center gy-2">
                                <div class="col-12 col-md-4 font-weight-bold text-dark text-truncate"><i class="fas fa-layer-group text-muted mr-2"></i> ${batch.name}</div>
                                <div class="col-6 col-md-2 order-md-2 text-muted small">${batch.launched_at}</div>
                                <div class="col-6 col-md-2 order-md-4"><span class="badge ${badgeClass} text-white">${batch.global_status}</span></div>
                                <div class="col-12 col-md-3 order-md-3">
                                    <div class="d-flex justify-content-between small mb-1">
                                        <span>${p.taken}/${p.expected} <span class="text-danger ml-1">${p.missed > 0 ? `(${p.missed} lost)` : ''}</span></span>
                                        <span class="font-weight-bold">${pct}%</span>
                                    </div>
                                    <div class="progress" style="height: 6px;"><div class="progress-bar ${badgeClass}" style="width: ${pct}%;"></div></div>
                                </div>
                                <div class="col-12 col-md-1 order-md-5 text-md-end">
                                    <span class="btn btn-sm btn-outline-danger btn-delete-batch" onclick="deletebatch(event, ${batch.id}, '${batch.name}')"><i class="fas fa-trash"></i></span>
                                </div>
                            </div>
                        </button>
                    </h2>
                    <div id="${collapseId}" class="accordion-collapse collapse ${isOpen}" data-bs-parent="#batchAccordion">
                        <div class="accordion-body p-0">
                            <table class="table table-sm table-dense table-responsive-cards mb-0"><tbody>${nodeRows}</tbody></table>
                        </div>
                    </div>
                </div>
                `;
            });
            
            if(batchs.length === 0) html = '<div class="text-center py-5 text-muted">No experiments recorded. Click "Sync Archive History" to backfill from modules.</div>';
            accordion.innerHTML = html;
        } catch (e) {
            console.error("Experiment Load Error:", e);
            if (spinner) spinner.style.display = 'none';
            document.getElementById('batchAccordion').style.display = 'block';
            document.getElementById('batchAccordion').innerHTML = `<div class="text-danger text-center py-4">Failed to load experiment database.</div>`;
        }
    }

    async function deletebatch(event, id, name) {
        event.stopPropagation();
        
        const confirmed = await asyncConfirm(
            `<i class="fas fa-trash"></i> Delete DB Record`, 
            `Are you sure you want to delete the Master DB record for <strong>'${name}'</strong>?<br><small class="text-danger">This does not delete files off the Raspberry Pis.</small>`,
            true // Danger mode
        );
        
        if(!confirmed) return;
        
        try {
            const res = await fetch(`/api/fleet/db/experiments/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error("Delete failed.");
            showToast(`Batch deleted successfully.`, 'success');
            loadExperiments();
        } catch(e) { 
            showToast("Failed to delete batch.", "danger"); 
        }
    }

    async function syncArchives() {
        const btn = document.getElementById('btn-sync-archives');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing...';
        
        try {
            const res = await fetch('/api/fleet/db/sync_archives', { method: 'POST' });
            if (!res.ok) throw new Error("Sync engine error.");
            const data = await res.json();
            showToast(data.message, 'success');
            loadExperiments(); 
        } catch (e) {
            console.error(e);
            showToast("Error communicating with the sync engine.", "danger");
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    async function purgeHistory() {
        const confirmed = await asyncConfirm(
            `<i class="fas fa-skull-crossbones"></i> Purge Database`, 
            `<strong>WARNING:</strong> This will permanently erase ALL experiment history from the Master Controller database.<br><br>Physical images on the Raspberry Pis will NOT be deleted.<br><br>Proceed?`,
            true // Danger mode
        );
        
        if(!confirmed) return;
        
        try {
            const res = await fetch('/api/fleet/db/purge', { method: 'DELETE' });
            if (!res.ok) throw new Error("Purge failed.");
            const data = await res.json();
            showToast(data.message, 'success');
            loadExperiments();
        } catch(e) {
            showToast("Failed to purge database.", "danger");
        }
    }

    loadExperiments();
</script>
{% endblock %}
