<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3 stat-header">
    <div>
        <h2 class="font-weight-bold mb-0"><i class="fas fa-network-wired text-primary"></i> Fleet Operations</h2>
        <div id="master-time-row" class="text-dark mt-1" style="font-size: 1.15rem; font-weight: 600;">
            <i class="fas fa-server text-primary"></i>
            Master time: <span id="master-time-value">—</span>
            <span id="master-ntp-status" class="badge bg-secondary align-middle" style="font-size: 0.75rem;">NTP</span>
        </div>
        <small class="text-muted" id="last-sync-time">Last scan: Waiting...</small>
    </div>
    <div class="d-flex text-center border bg-white rounded shadow-sm py-2 stat-strip">
        <div class="stat-strip-item border-end">
            <h4 class="mb-0 font-weight-bold" id="stat-total">0</h4><small class="text-muted text-uppercase" style="font-size: 0.65rem; font-weight: 700;">Total Nodes</small>
        </div>
        <div class="stat-strip-item border-end">
            <h4 class="mb-0 font-weight-bold text-success" id="stat-running">0</h4><small class="text-muted text-uppercase" style="font-size: 0.65rem; font-weight: 700;">Active</small>
        </div>
        <div class="stat-strip-item">
            <h4 class="mb-0 font-weight-bold text-danger" id="stat-errors">0</h4><small class="text-muted text-uppercase" style="font-size: 0.65rem; font-weight: 700;">Faults</small>
        </div>
    </div>
</div>
