
<div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
    <div class="d-flex align-items-center gap-2 flex-wrap">
        <button class="btn btn-sm btn-outline-info font-weight-bold" onclick="triggerDiscovery()" id="btn-discover">
            <i class="fas fa-satellite-dish"></i> Discover Nodes
        </button>
        <button class="btn btn-sm btn-outline-secondary font-weight-bold" onclick="updateCommanderSoftware()" id="btn-commander-update">
            <i class="fas fa-download"></i> Update Software
        </button>
        <button class="btn btn-sm btn-outline-dark font-weight-bold" onclick="openCommanderTimeModal()" id="btn-commander-time">
            <i class="fas fa-clock"></i> Commander Time
        </button>
        <button class="btn btn-sm btn-outline-primary font-weight-bold" onclick="openCommanderNetworkModal()" id="btn-commander-network">
            <i class="fas fa-network-wired"></i> Network
        </button>
    </div>
</div>

<div id="discovery-progress" class="alert alert-info py-2 px-3 mb-3 small d-none align-items-center gap-2" role="status" aria-live="polite">
    <i class="fas fa-spinner fa-spin" id="discovery-progress-icon"></i>
    <span id="discovery-progress-text">Preparing discovery…</span>
</div>

<div class="d-flex justify-content-between align-items-start mb-3 gap-3 fleet-toolbar">
    <div class="fleet-toolbar-half d-flex flex-column">
        <div class="d-flex align-items-center gap-2 filter-chip-row">
            <button class="btn btn-sm btn-filter active" onclick="filterView('ALL', this)">All <span id="count-ALL" class="badge bg-secondary text-white ms-1 rounded-pill">0</span></button>
            <button class="btn btn-sm btn-filter" onclick="filterView('RUNNING', this)">Running <span id="count-RUNNING" class="badge bg-primary text-white ms-1 rounded-pill">0</span></button>
            <button class="btn btn-sm btn-filter" onclick="filterView('IDLE', this)">Standby <span id="count-IDLE" class="badge bg-light text-dark border ms-1 rounded-pill">0</span></button>
            <button class="btn btn-sm btn-filter text-muted" onclick="filterView('OFFLINE', this)">Offline <span id="count-OFFLINE" class="badge bg-dark text-white ms-1 rounded-pill">0</span></button>
            
            <button class="btn btn-sm btn-filter text-danger" onclick="filterView('ATTENTION', this)">
                <i class="fas fa-exclamation-circle"></i> Needs Attention <span id="count-ATTENTION" class="badge bg-danger text-white ms-1 rounded-pill">0</span>
            </button>
            
            <div class="form-check form-switch py-1 hide-offline-toggle">
                <input class="form-check-input" type="checkbox" id="hideOfflineToggle" onchange="fetchFleetData()">
                <label class="form-check-label small text-muted font-weight-bold mt-1" for="hideOfflineToggle" style="cursor: pointer;">Hide Offline</label>
            </div>
        </div>

        <div class="d-flex align-items-center mt-2 flex-wrap gap-2">
            <div class="d-inline-flex shadow-sm filter-bar align-items-center sort-search-group">
            <label for="sortKeySelect" class="small text-muted font-weight-bold mb-0">Sort</label>
            <select id="sortKeySelect" class="form-select form-select-sm" onchange="onSortChanged()">
                <option value="MODULE_ID">Module ID</option>
                <option value="LOCATION">Location</option>
            </select>
            <button id="sortDirBtn" class="btn btn-sm btn-outline-secondary" onclick="toggleSortDirection()" title="Toggle ascending/descending">
                <i class="fas fa-sort-alpha-down"></i>
            </button>

            <label for="descSearchInput" class="small text-muted font-weight-bold mb-0">Search</label>
            <input
                id="descSearchInput"
                type="text"
                class="form-control form-control-sm"
                placeholder="Name or description"
                oninput="onDescriptionSearchInput()"
            >
            <button id="descSearchClearBtn" class="btn btn-sm btn-outline-secondary" onclick="clearDescriptionSearch()" title="Clear search">
                <i class="fas fa-times"></i>
            </button>
            </div>

            <div class="d-inline-flex shadow-sm filter-bar align-items-center row-density-group">
                <span class="small text-muted font-weight-bold mb-0">Row density</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="collapseAllRows()">
                    <i class="fas fa-compress-alt"></i> Collapse All
                </button>
                <button class="btn btn-sm btn-outline-secondary" onclick="expandAllRows()">
                    <i class="fas fa-expand-alt"></i> Expand All
                </button>
            </div>
        </div>
    </div>

    <div class="fleet-toolbar-half d-flex align-items-start">
        <div class="bulk-action-bar d-flex flex-column align-items-start gap-2">
            <div class="d-flex align-items-baseline gap-2 flex-wrap">
                <span class="font-weight-bold text-dark">Global Actions</span>
                <span class="text-muted small">Modules selected: <strong id="selected-count" class="text-dark">0</strong></span>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary font-weight-bold" onclick="executeBulk('DIAGNOSTIC')"><i class="fas fa-stethoscope"></i> Diagnostics</button>
                <button class="btn btn-sm btn-outline-danger font-weight-bold" onclick="executeBulk('REBOOT')"><i class="fas fa-power-off"></i> Reboot</button>
                <button class="btn btn-sm btn-outline-success font-weight-bold" onclick="executeBulk('UPDATE')"><i class="fas fa-download"></i> Update</button>
                <button class="btn btn-sm btn-outline-info font-weight-bold" onclick="executeBulk('SYNC')"><i class="fas fa-cloud-upload-alt"></i> Launch Sync</button>
                <button class="btn btn-sm btn-outline-danger font-weight-bold" onclick="executeBulk('CANCEL_SYNC')"><i class="fas fa-times"></i> Abort Transfer</button>
                <button class="btn btn-sm btn-dark font-weight-bold" onclick="openConfigModal()"><i class="fas fa-cogs"></i> Configure</button>
                <button class="btn btn-sm btn-primary font-weight-bold" onclick="openExperimentModal()"><i class="fas fa-flask"></i> Launch Batch Experiment</button>
            </div>
        </div>
    </div>
</div>

<script>
    function updateSortDirectionIcon() {
        const btn = document.getElementById('sortDirBtn');
        if (!btn) return;
        btn.innerHTML = currentSortDirection === 'ASC'
            ? '<i class="fas fa-sort-alpha-down"></i>'
            : '<i class="fas fa-sort-alpha-up"></i>';
    }

    function onSortChanged() {
        const select = document.getElementById('sortKeySelect');
        if (!select) return;
        currentSortKey = select.value;
        fetchFleetData();
    }

    function toggleSortDirection() {
        currentSortDirection = currentSortDirection === 'ASC' ? 'DESC' : 'ASC';
        updateSortDirectionIcon();
        fetchFleetData();
    }

    function onDescriptionSearchInput() {
        const input = document.getElementById('descSearchInput');
        if (!input) return;
        currentDescriptionQuery = input.value || '';

        if (descriptionSearchDebounce) clearTimeout(descriptionSearchDebounce);
        descriptionSearchDebounce = setTimeout(() => {
            fetchFleetData();
        }, 200);
    }

    function clearDescriptionSearch() {
        currentDescriptionQuery = '';
        const input = document.getElementById('descSearchInput');
        if (input) input.value = '';
        if (descriptionSearchDebounce) clearTimeout(descriptionSearchDebounce);
        fetchFleetData();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const select = document.getElementById('sortKeySelect');
        if (select) select.value = currentSortKey;
        const searchInput = document.getElementById('descSearchInput');
        if (searchInput) searchInput.value = currentDescriptionQuery;
        updateSortDirectionIcon();
    });

    let discoveryPollTimer = null;

    function setDiscoveryProgressVisible(show) {
        const el = document.getElementById('discovery-progress');
        if (!el) return;
        el.classList.toggle('d-none', !show);
        el.classList.toggle('d-flex', show);
    }

    function renderDiscoveryProgress(data) {
        const textEl = document.getElementById('discovery-progress-text');
        const iconEl = document.getElementById('discovery-progress-icon');
        const strip = document.getElementById('discovery-progress');
        if (!textEl || !strip) return;

        const detail = data.detail || 'Working…';
        let extra = '';
        if (data.phase === 'enriching' || data.phase === 'saving' || data.phase === 'done') {
            if (data.responders != null) {
                extra = ` (${data.responders} responder${data.responders === 1 ? '' : 's'})`;
            }
        }
        textEl.textContent = detail + (data.phase === 'done' || data.phase === 'error' ? '' : extra);

        strip.classList.remove('alert-info', 'alert-success', 'alert-danger');
        if (data.phase === 'done') {
            strip.classList.add('alert-success');
            if (iconEl) iconEl.className = 'fas fa-check-circle';
        } else if (data.phase === 'error') {
            strip.classList.add('alert-danger');
            if (iconEl) iconEl.className = 'fas fa-exclamation-triangle';
        } else {
            strip.classList.add('alert-info');
            if (iconEl) iconEl.className = 'fas fa-spinner fa-spin';
        }
        setDiscoveryProgressVisible(true);
    }

    function stopDiscoveryPolling() {
        if (discoveryPollTimer) {
            clearInterval(discoveryPollTimer);
            discoveryPollTimer = null;
        }
    }

    function startDiscoveryPolling() {
        stopDiscoveryPolling();
        discoveryPollTimer = setInterval(async () => {
            try {
                const res = await fetch('/api/fleet/discover/status', { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();
                renderDiscoveryProgress(data);
                if (!data.running && (data.phase === 'done' || data.phase === 'error' || data.phase === 'idle')) {
                    stopDiscoveryPolling();
                }
            } catch (_) { /* ignore transient poll errors */ }
        }, 400);
    }

    async function triggerDiscovery() {
        const btn = document.getElementById('btn-discover');
        const originalText = btn.innerHTML;
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scanning Subnet...';
        renderDiscoveryProgress({
            phase: 'scanning',
            detail: 'Starting subnet discovery…',
            running: true,
        });
        startDiscoveryPolling();
        
        try {
            const res = await fetch('/api/fleet/discover', { method: 'POST' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const detail = data.detail;
                const msg = typeof detail === 'string'
                    ? detail
                    : (data.message || `Discovery failed (HTTP ${res.status}).`);
                renderDiscoveryProgress({ phase: 'error', detail: msg, running: false });
                showToast(`<i class="fas fa-exclamation-triangle"></i> ${msg}`, 'danger');
                return;
            }
            renderDiscoveryProgress({
                phase: 'done',
                detail: data.message,
                responders: data.count,
                registered: data.count,
                running: false,
            });
            showToast(`<i class="fas fa-satellite-dish"></i> ${data.message}`, 'success');
            
            let lastScanEl = document.getElementById('last-discovery-time');
            if (lastScanEl) lastScanEl.innerText = "Last Discovery: " + new Date().toLocaleTimeString();
            
            if(typeof fetchFleetData === 'function') fetchFleetData();

            setTimeout(() => {
                const strip = document.getElementById('discovery-progress');
                if (strip && strip.classList.contains('alert-success')) {
                    setDiscoveryProgressVisible(false);
                }
            }, 8000);
        } catch(e) {
            console.error("Discovery Error:", e);
            const msg = e.message || 'Failed to scan subnet.';
            renderDiscoveryProgress({ phase: 'error', detail: msg, running: false });
            showToast(`<i class="fas fa-exclamation-triangle"></i> Failed to scan subnet.`, 'danger');
        } finally {
            stopDiscoveryPolling();
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    async function updateCommanderSoftware() {
        const btn = document.getElementById('btn-commander-update');
        const originalText = btn.innerHTML;
        const confirmed = await asyncConfirm(
            'Update Fleet Commander',
            'Pull the latest code for this Fleet Commander? If new code is downloaded the service will restart.',
            false
        );
        if (!confirmed) return;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
        try {
            const res = await fetch('/api/commander/update', { method: 'POST' });
            const data = await res.json().catch(() => ({}));
            const body = (data.detail && typeof data.detail === 'object' && !Array.isArray(data.detail))
                ? Object.assign({}, data, data.detail)
                : data;
            const code = body.code || (body.result === false ? 'git_error' : (body.changed ? 'updated' : 'up_to_date'));
            const labels = {
                updated: 'Updated — restarting',
                up_to_date: 'Already up to date',
                network_error: 'Cannot reach Git remote',
                authentication_error: 'Git authentication failed',
                repository_error: 'Repository configuration error',
                permission_error: 'Repository permission error',
                timeout: 'Update timed out',
                git_unavailable: 'Git unavailable',
                git_error: 'Git update failed',
            };
            const label = labels[code] || (body.result === false ? 'Git update failed' : 'Update complete');
            let message = body.message || (typeof body.detail === 'string' ? body.detail : '') || 'Update failed.';
            const span = document.createElement('span');
            span.textContent = message;
            const detailHtml = span.innerHTML.replace(/\n/g, '<br>');
            const html = `<strong>${label}</strong><br>${detailHtml}`;

            if (!res.ok || body.result === false) {
                showToast(`<i class="fas fa-exclamation-triangle"></i> ${html}`, 'danger');
                return;
            }
            showToast(`<i class="fas fa-check"></i> ${html}`, 'success');
        } catch (e) {
            console.error('Commander update error:', e);
            showToast('<i class="fas fa-exclamation-triangle"></i> Failed to update Fleet Commander.', 'danger');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
</script>
