<div class="bg-white border rounded shadow-sm overflow-hidden">
    <table class="table table-dense table-fleet table-responsive-cards mb-0 w-100">
        <thead>
            <tr>
                <th width="3%" class="text-center"><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></th>
                <th width="15%">Identity</th>
                <th width="32%">Experiment Status</th>
                <th width="35%">Hardware & State</th>
                <th width="15%" class="text-center">Node Actions</th>
            </tr>
        </thead>
        <tbody id="fleet-table-body">
            <tr><td colspan="5" class="text-center py-5 text-muted"><i class="fas fa-circle-notch fa-spin fa-2x mb-3"></i><br>Sweeping network...</td></tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="proxyModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-xl modal-fullscreen-sm-down proxy-modal-dialog">
    <div class="modal-content shadow h-100">
      <div class="modal-header bg-dark text-white border-0 py-2">
        <h5 class="modal-title"><i class="fas fa-desktop"></i> Remote View: <span id="proxy-hostname" class="text-info"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="closeProxy()"></button>
      </div>
      <div class="modal-body p-0 bg-light h-100">
        <div id="proxy-spinner" class="text-center py-5 text-muted">
            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i><br>Tunneling to Edge Node...
        </div>
        <iframe id="proxy-frame" style="width: 100%; height: 100%; border: none; display: none;" onload="hideProxySpinner()"></iframe>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="historyModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content shadow">
      <div class="modal-header bg-dark text-white border-0 py-3">
        <h5 class="modal-title"><i class="fas fa-server"></i> <span id="hist-hostname"></span> Experiment History</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body bg-light" style="max-height: 70vh; overflow-y: auto;">
        <h6 class="font-weight-bold text-uppercase text-muted small"><i class="fas fa-flask"></i> Experiments</h6>
        <div class="bg-white border rounded shadow-sm mb-4">
            <table class="table table-sm table-hover mb-0">
                <thead class="bg-light text-muted small">
                    <tr><th>Date</th><th>Experimental Batch Name</th><th>Status</th><th>Yield</th><th>Link</th></tr>
                </thead>
                <tbody id="hist-runs-body"></tbody>
            </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="identityModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow border-0">
      <div class="modal-header bg-light border-bottom py-3">
        <h5 class="modal-title text-dark"><i class="fas fa-id-badge text-primary"></i> Edit Module Identity</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body bg-white">
        <input type="hidden" id="ident-mac">
        <div class="mb-3">
            <label class="form-label small font-weight-bold text-muted text-uppercase mb-1">ID Name (Alias)</label>
            <input type="text" class="form-control" id="ident-name" placeholder="e.g. Chamber 1 Alpha">
        </div>
        <div class="mb-2">
            <label class="form-label small font-weight-bold text-muted text-uppercase mb-1">Description</label>
            <textarea class="form-control" id="ident-desc" rows="2" placeholder="e.g. Top shelf, left rack."></textarea>
            <small class="text-muted font-italic">Helps identify the physical hardware in the lab.</small>
        </div>
      </div>
      <div class="modal-footer bg-light border-top py-2">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary font-weight-bold px-4" onclick="saveIdentity()">
            <i class="fas fa-save"></i> Save Identity
        </button>
      </div>
    </div>
  </div>
</div>

<script>
    // --- TABLE SELECTION & FILTERING ---
    function toggleSelection(mac) {
        if (selectedMacs.has(mac)) selectedMacs.delete(mac);
        else selectedMacs.add(mac);
        document.getElementById('selected-count').innerText = selectedMacs.size;
        if(typeof calculateEstimates === 'function') calculateEstimates();
    }

    function toggleAll(source) {
        let checkboxes = document.querySelectorAll('.module-checkbox:not(:disabled)');
        checkboxes.forEach(cb => {
            let row = cb.closest('tr');
            if (row.style.display !== 'none') {
                cb.checked = source.checked;
                if (source.checked) selectedMacs.add(cb.value);
                else selectedMacs.delete(cb.value);
            }
        });
        document.getElementById('selected-count').innerText = selectedMacs.size;
        if(typeof calculateEstimates === 'function') calculateEstimates();
    }

    function filterView(view, btnElement) {
        currentView = view;
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        if(btnElement) btnElement.classList.add('active');
        fetchFleetData(); 
    }

    function normalizeSortText(value) {
        return (value || '').toString().trim().toLowerCase();
    }

    function tokenizeNaturalKey(value) {
        return normalizeSortText(value).match(/\d+|\D+/g) || [];
    }

    function compareNatural(aValue, bValue) {
        const aParts = tokenizeNaturalKey(aValue);
        const bParts = tokenizeNaturalKey(bValue);
        const maxLen = Math.max(aParts.length, bParts.length);

        for (let i = 0; i < maxLen; i++) {
            const aPart = aParts[i];
            const bPart = bParts[i];

            if (aPart === undefined) return -1;
            if (bPart === undefined) return 1;

            const aNum = /^\d+$/.test(aPart);
            const bNum = /^\d+$/.test(bPart);

            if (aNum && bNum) {
                const aN = Number(aPart);
                const bN = Number(bPart);
                if (aN < bN) return -1;
                if (aN > bN) return 1;
                continue;
            }

            if (aPart < bPart) return -1;
            if (aPart > bPart) return 1;
        }
        return 0;
    }

    function sortFleetNodes(nodes) {
        const dir = currentSortDirection === 'DESC' ? -1 : 1;
        const sortedNodes = [...nodes];
        sortedNodes.sort((a, b) => {
            let aKey = '';
            let bKey = '';

            if (currentSortKey === 'LOCATION') {
                aKey = normalizeSortText(a.description);
                bKey = normalizeSortText(b.description);
            } else {
                aKey = normalizeSortText(a.hostname);
                bKey = normalizeSortText(b.hostname);
            }

            if (aKey === bKey) {
                const aFallback = normalizeSortText(a.mac);
                const bFallback = normalizeSortText(b.mac);
                return compareNatural(aFallback, bFallback) * dir;
            }

            return compareNatural(aKey, bKey) * dir;
        });
        return sortedNodes;
    }

    function isRowCollapsed(mac) {
        return collapsedRows.has(mac);
    }

    function toggleRowCollapsed(mac) {
        if (collapsedRows.has(mac)) collapsedRows.delete(mac);
        else collapsedRows.add(mac);
        fetchFleetData();
    }

    function collapseAllRows() {
        (lastFleetNodeMacs || []).forEach(mac => collapsedRows.add(mac));
        fetchFleetData();
    }

    function expandAllRows() {
        collapsedRows.clear();
        fetchFleetData();
    }

    let fleetPollTimer = null;
    let fleetPollIntervalMs = 5000;

    function getFleetPollInterval(nodeCount) {
        return nodeCount > 10 ? 12000 : 5000;
    }

    function ensureFleetPolling() {
        if (fleetPollTimer) return;
        fleetPollTimer = setInterval(() => {
            if (document.visibilityState === 'visible') fetchFleetData();
        }, fleetPollIntervalMs);
    }

    function updatePollIntervalIfNeeded(nodeCount) {
        const next = getFleetPollInterval(nodeCount);
        if (next === fleetPollIntervalMs) return;
        fleetPollIntervalMs = next;
        if (fleetPollTimer) {
            clearInterval(fleetPollTimer);
            fleetPollTimer = null;
        }
        ensureFleetPolling();
    }

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') fetchFleetData();
    });

    function formatStaleBadge(node) {
        if (!node.telemetry_stale) return '';
        const age = node.telemetry_age_seconds;
        const label = age != null ? `Updated ${age}s ago` : 'Telemetry stale';
        return `<div class="mt-1"><span class="badge bg-warning text-dark px-2 py-1"><i class="fas fa-hourglass-half"></i> ${label}</span></div>`;
    }

    function parseFleetDateTime(value) {
        if (!value || value === 'Unknown' || value === 'None') return null;
        const raw = value.toString().trim();

        const timeOnlyMatch = raw.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
        if (timeOnlyMatch) {
            const now = new Date();
            const hour = Number(timeOnlyMatch[1]);
            const minute = Number(timeOnlyMatch[2]);
            const second = Number(timeOnlyMatch[3] || 0);
            const dt = new Date(now);
            dt.setHours(hour, minute, second, 0);
            if (dt.getTime() < now.getTime()) {
                dt.setDate(dt.getDate() + 1);
            }
            return dt;
        }

        const normalized = value.includes('T') ? value : value.replace(' ', 'T');
        const parsed = new Date(normalized);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatFleetDateTime(value) {
        const parsed = parseFleetDateTime(value);
        if (!parsed) return 'Unknown';
        return parsed.toLocaleString([], {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
        });
    }

    function formatNextCaptureRelative(value) {
        const parsed = parseFleetDateTime(value);
        if (!parsed) return 'Unknown';
        const diffMs = parsed.getTime() - Date.now();
        if (diffMs <= 0) return 'now';

        const totalMinutes = Math.ceil(diffMs / 60000);
        if (totalMinutes < 1) return 'now';
        if (totalMinutes < 60) return `in ${totalMinutes} min`;

        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (hours < 24) return minutes > 0 ? `in ${hours}h ${minutes}m` : `in ${hours}h`;

        const days = Math.floor(hours / 24);
        const remHours = hours % 24;
        return remHours > 0 ? `in ${days}d ${remHours}h` : `in ${days}d`;
    }

    function healthBadgeClass(status) {
        if (status === 'OK') return 'bg-success';
        if (status === 'UNTESTED') return 'bg-warning text-dark';
        return 'bg-danger';
    }

    function healthTextClass(status) {
        if (status === 'OK') return 'text-success font-weight-bold';
        if (status === 'UNTESTED') return 'text-warning font-weight-bold';
        return 'text-danger font-weight-bold';
    }

    function cameraBadgeClass(node) {
        if (node.cams_ok === node.cams_total && node.cams_total > 0) return 'bg-success';
        if ((node.cams_failed || 0) > 0 || (node.cams_ok > 0 && node.cams_ok < node.cams_total)) return 'bg-danger';
        return 'bg-warning text-dark';
    }

    function formatLightsLabel(node) {
        const health = node.lights_health || 'UNKNOWN';
        const state = node.lights_state;
        if (health === 'OK' && (state === 'ON' || state === 'OFF')) {
            return `Lights ${health} (${state})`;
        }
        return `Lights ${health}`;
    }

    function renderPerCameraChips(perCameraStatus) {
        if (!perCameraStatus || perCameraStatus.length === 0) return '';
        const chips = perCameraStatus.map(cam => {
            const capturing = cam.activity === 'CAPTURING'
                ? ' <i class="fas fa-circle-notch fa-spin" style="font-size: 0.6rem;"></i>'
                : '';
            return `<span class="badge ${healthBadgeClass(cam.health)} me-1 mb-1" style="font-size: 0.65rem;">Cam${cam.id} ${cam.health}${capturing}</span>`;
        }).join('');
        return `<div class="d-flex flex-wrap mt-2">${chips}</div>`;
    }

    function renderLiveJobExtras(node) {
        const detail = node.job_detail || {};
        let html = '';

        html += renderPerCameraChips(detail.per_camera_status);

        if (detail.experiment_gaps && detail.experiment_gaps.length > 0) {
            const gapLines = detail.experiment_gaps.map(gap =>
                `<div class="text-warning small"><i class="fas fa-exclamation-triangle"></i> Cam ${gap.cam}: ${gap.behind_by} picture${gap.behind_by === 1 ? '' : 's'} behind</div>`
            ).join('');
            html += `<div class="mt-2 border-start border-warning ps-2">${gapLines}</div>`;
        }

        if (detail.all_cameras_failed) {
            html += `<div class="mt-2 badge bg-danger text-white w-100 text-start"><i class="fas fa-exclamation-circle"></i> All cameras failed on last round — watchdog may reboot</div>`;
        }

        return html;
    }

    function renderCameraCellSummary(node, jobDetail) {
        const baseClass = cameraBadgeClass(node);
        const camsClass = baseClass === 'bg-success' ? 'text-success' : (baseClass === 'bg-danger' ? 'text-danger font-weight-bold' : 'text-warning font-weight-bold');
        let text = `<i class="fas fa-video"></i> ${node.cams_ok}/${node.cams_total} OK`;
        if (jobDetail && jobDetail.experiment_gaps && jobDetail.experiment_gaps.length > 0) {
            const gapHints = jobDetail.experiment_gaps.map(gap => `Cam${gap.cam} -${gap.behind_by}`).join(', ');
            text += ` · ${gapHints}`;
        }
        return `<div class="${camsClass}">${text}</div>`;
    }

    function renderCollapsedJobLine(node) {
        if (!node.has_job || node.is_diagnosing) {
            return 'No active experiment.';
        }
        const detail = node.job_detail || {};
        const roundsTaken = detail.rounds_taken != null ? detail.rounds_taken : node.taken;
        const roundsExpected = detail.rounds_expected != null ? detail.rounds_expected : node.expected;
        let line = `${roundsTaken}/${roundsExpected} rounds`;
        if (detail.has_camera_mismatch && detail.experiment_gaps && detail.experiment_gaps.length > 0) {
            const gapHint = detail.experiment_gaps.map(gap => `Cam${gap.cam} -${gap.behind_by}`).join(', ');
            line += ` · ${gapHint}`;
        } else if (detail.has_camera_mismatch) {
            line += ' · cam mismatch';
        }
        return line;
    }

    function renderAttentionBadge(node) {
        if (!node.needs_attention) return '';
        const issuesTitle = (node.issues || []).join(', ');
        return `<span class="badge bg-danger" title="${issuesTitle}"><i class="fas fa-exclamation-triangle"></i> Attention</span>`;
    }

    function renderAttentionIssues(node) {
        if (!node.needs_attention || !node.issues || node.issues.length === 0) return '';
        const issuesText = node.issues.join(', ');
        return `<div class="badge bg-white text-dark border border-danger text-start text-wrap fw-normal" style="white-space: normal; line-height: 1.35;"><i class="fas fa-exclamation-triangle text-danger"></i> ${issuesText}</div>`;
    }

    function renderCollapseToggleButton(mac, collapsed) {
        const icon = collapsed ? 'fa-expand-alt' : 'fa-compress-alt';
        const label = collapsed ? 'Expand' : 'Collapse';
        return `<button class="btn btn-xs btn-outline-secondary py-0 px-2" style="font-size: 0.7rem;" onclick="toggleRowCollapsed('${mac}')"><i class="fas ${icon}"></i> ${label}</button>`;
    }

    function renderOfflineRow(node, checkboxHtml) {
        const desc = node.description ? node.description : '<span style="opacity:0.5; font-style: italic;">No location set...</span>';
        const safeHost = (node.hostname || '').replace(/'/g, "\\'");
        return `
            <tr class="row-hover" style="opacity: 0.6; background-color: #f8f9fa;">
                <td class="text-center">${checkboxHtml}</td>
                <td data-label="Identity">
                    <div class="d-flex align-items-start justify-content-between gap-2 mb-1">
                        <div class="font-weight-bold text-dark text-truncate" style="font-size: 1.05rem; cursor: pointer;"
                            onclick="openIdentityModal('${node.mac}', '${safeHost}', '${node.description || ''}')" title="Click to edit identity">
                            <i class="fas fa-edit small text-primary" style="opacity: 0.6;"></i> ${node.hostname}
                        </div>
                        ${renderCollapseToggleButton(node.mac, false)}
                    </div>
                    <div class="text-muted small text-truncate mb-2" style="font-size: 0.82rem;">${desc}</div>
                    <div class="text-muted hw-detail" style="font-family: monospace; font-size: 0.75rem;"><i class="fas fa-microchip"></i> MAC: ${node.mac}</div>
                    <div class="text-muted hw-detail" style="font-family: monospace; font-size: 0.75rem;"><i class="fas fa-network-wired"></i> IP: ${node.ip}</div>
                    <div class="text-muted small mt-1">Last seen: ${node.last_seen || 'Unknown'}</div>
                </td>
                <td colspan="2" class="text-muted small font-italic align-middle" data-label="Status">Module offline</td>
                <td data-label="Actions">
                    <button onclick="removeModuleFromFleet('${node.mac}', '${safeHost}')" class="btn btn-sm btn-outline-secondary w-100 justify-content-start">
                        <div style="width: 24px; text-align: center;"><i class="fas fa-trash-alt"></i></div> Remove from Fleet
                    </button>
                </td>
            </tr>`;
    }

    function renderOfflineRowCollapsed(node, checkboxHtml) {
        const desc = node.description ? node.description : '<span style="opacity:0.5; font-style: italic;">No location set...</span>';
        const safeHost = (node.hostname || '').replace(/'/g, "\\'");
        return `
            <tr class="row-hover" style="opacity: 0.85;">
                <td class="text-center">${checkboxHtml}</td>
                <td data-label="Identity">
                    <div class="d-flex align-items-start justify-content-between gap-2">
                        <div class="font-weight-bold text-dark text-truncate" style="font-size: 0.96rem;">
                            ${node.hostname}
                        </div>
                        ${renderCollapseToggleButton(node.mac, true)}
                    </div>
                    <div class="text-muted small text-truncate">${desc}</div>
                    <div class="text-muted" style="font-family: monospace; font-size: 0.72rem;">${node.mac} | ${node.ip}</div>
                </td>
                <td style="width: 20%;" data-label="Experiment Status">
                    <span class="badge bg-secondary">OFFLINE</span>
                </td>
                <td data-label="Hardware &amp; State"><div class="text-muted small">Module offline</div></td>
                <td data-label="Node Actions">
                    <button onclick="removeModuleFromFleet('${node.mac}', '${safeHost}')" class="btn btn-sm btn-outline-secondary w-100 justify-content-start">
                        <div style="width: 24px; text-align: center;"><i class="fas fa-trash-alt"></i></div> Remove from Fleet
                    </button>
                </td>
            </tr>`;
    }

    function renderOnlineRow(node, checkboxHtml) {
        const storageWarn = node.storage_pct > 85;
        const syncData = node.sync_status || {};
        const staleBadge = formatStaleBadge(node);
        const jobDetail = node.job_detail || {};
        const lightsHealth = node.lights_health || 'UNKNOWN';
        const lightsColorClass = healthTextClass(lightsHealth);

        const syncStatus = node.time_sync_status || "";
        const driftTitle = node.drift_seconds !== "N/A"
            ? `Drift at last status poll: ${node.drift_seconds}s`
            : "Drift at last status poll";
        let timeBadge = "";
        if (node.telemetry_stale) {
            const staleDrift = node.drift_seconds !== "N/A"
                ? `<br><small>Drift: ${node.drift_seconds}s</small>`
                : "";
            timeBadge = `<span class="text-warning font-weight-bold" title="${driftTitle}"><i class="fas fa-hourglass-half"></i> ${syncStatus}${staleDrift}</span>`;
        } else if (syncStatus.includes("Synced")) {
            timeBadge = `<span class="text-success font-weight-bold" title="${driftTitle}"><i class="fas fa-check-circle"></i> ${syncStatus}</span>`;
        } else if (syncStatus.includes("Drift")) {
            let driftText = node.drift_seconds !== "N/A" ? `Drift: ${node.drift_seconds}s` : "Drift: Unknown";
            let readableDrift = driftText;
            if (typeof node.drift_seconds === "number" && node.drift_seconds > 120) {
                readableDrift = `Drift: ${Math.floor(node.drift_seconds / 60)} mins`;
            }
            timeBadge = `<span class="text-danger font-weight-bold" title="${driftTitle}"><i class="fas fa-times-circle"></i> ${syncStatus}<br><small>${readableDrift}</small></span>`;
        } else {
            timeBadge = `<span class="text-warning font-weight-bold" title="${driftTitle}"><i class="fas fa-exclamation-triangle"></i> ${syncStatus}</span>`;
        }

        let uptimeHtml = node.uptime && node.uptime !== "Unknown"
            ? `<div class="text-dark font-weight-bold"><i class="fas fa-stopwatch text-secondary"></i> ${node.uptime}</div>`
            : `<div class="text-muted"><i class="fas fa-stopwatch text-secondary" style="opacity: 0.5;"></i> Unknown</div>`;

        let jobHtml = '<div class="text-muted small font-italic py-2"><i class="fas fa-bed"></i> System Idle (No active experiment)</div>';
        if (node.is_diagnosing) {
            jobHtml = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <strong class="text-info text-truncate"><i class="fas fa-stethoscope fa-pulse mr-1"></i> Hardware Scan</strong>
                    <span class="badge border border-info text-info bg-white small">DIAGNOSING</span>
                </div>
                <div class="text-muted small font-italic mb-3">Testing I2C bus and active camera ports...</div>
                <div class="progress rounded-pill shadow-sm" style="height: 8px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-info w-100"></div>
                </div>`;
        } else if (node.has_job) {
            const statCol = node.job_status === 'ERROR' ? 'text-danger' : (node.job_status === 'SCHEDULED' ? 'text-warning' : 'text-primary');
            const barColor = node.job_status === 'ERROR' ? 'bg-danger' : (node.job_status === 'SCHEDULED' ? 'bg-warning' : 'bg-success progress-bar-striped progress-bar-animated');
            const roundsTaken = jobDetail.rounds_taken != null ? jobDetail.rounds_taken : node.taken;
            const roundsExpected = jobDetail.rounds_expected != null ? jobDetail.rounds_expected : node.expected;
            const progressText = node.job_status === 'SCHEDULED' ? 'Waiting to start...' : `${roundsTaken} of ${roundsExpected} capture rounds`;
            const startText = formatFleetDateTime(node.job_start);
            const endText = formatFleetDateTime(node.job_end);
            const nextCaptureText = formatNextCaptureRelative(node.next_pic_at || node.next_pic_time);
            const mismatchBorder = jobDetail.has_camera_mismatch ? 'border-start border-warning border-3 ps-2' : '';
            jobHtml = `
                <div class="${mismatchBorder}">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <strong class="${statCol} text-truncate" style="max-width: 180px;" title="${node.job_name}">${node.job_name || 'Untitled'}</strong>
                    <span class="badge border ${statCol} bg-white small">${node.job_status}</span>
                </div>
                <div class="text-muted small text-truncate" title="Folder Name"><i class="fas fa-folder-open text-warning"></i> ${node.local_exp_id || 'Unknown Folder'}</div>
                ${node.job_desc ? `<div class="text-muted small font-italic mb-2 text-truncate" title="${node.job_desc}">"${node.job_desc}"</div>` : '<div class="mb-2"></div>'}
                <div class="d-flex justify-content-between align-items-center mb-1 hw-detail text-muted">
                    <span><i class="fas fa-camera"></i> ${progressText}</span>
                    <span class="font-weight-bold">${node.progress_pct}%</span>
                </div>
                <div class="mini-bar-container mb-2"><div class="mini-bar ${barColor}" style="width: ${node.progress_pct}%;"></div></div>
                <div class="hw-detail text-muted mb-1">
                    <i class="fas fa-calendar-alt"></i> Start: ${startText}
                    <span class="mx-2">|</span>
                    <i class="fas fa-flag-checkered"></i> End: ${endText}
                </div>
                <div class="hw-detail text-primary font-weight-bold bg-light border rounded px-2 py-1 d-inline-block mt-1">
                    <i class="fas fa-clock"></i> Next Capture: ${nextCaptureText}
                </div>
                ${renderLiveJobExtras(node)}
                </div>`;
        }

        const lockHtml = node.is_locked
            ? `<span class="text-warning font-weight-bold" title="Owner: ${node.lock_owner}"><i class="fas fa-lock"></i> Locked (${node.lock_owner})</span>`
            : `<span class="text-success"><i class="fas fa-check-circle"></i> Free</span>`;

        let syncHtml = '';
        if (syncData.is_syncing) {
            syncHtml = `<div class="text-info font-weight-bold text-truncate" title="${syncData.status_msg}"><i class="fas fa-sync fa-spin"></i> Syncing</div><div class="text-muted small text-truncate">${syncData.status_msg}</div>`;
        } else if (syncData.last_error) {
            syncHtml = `<div class="text-danger font-weight-bold"><i class="fas fa-exclamation-triangle"></i> Sync Failed</div><div class="text-muted small text-truncate" title="${syncData.last_error}">${syncData.last_error}</div>`;
        } else if (syncData.sync_enabled) {
            syncHtml = `<div class="text-success"><i class="fas fa-check-circle"></i> Auto-Sync ON</div><div class="text-muted small">Last: ${syncData.last_success || 'Never'}</div>`;
        } else {
            syncHtml = `<div class="text-muted"><i class="fas fa-times-circle"></i> Sync OFF</div>`;
        }

        const safeHost = (node.hostname || '').replace(/'/g, "\\'");
        const rawHost = (node.raw_hostname || node.hostname || '').replace(/'/g, "\\'");

        return `
            <tr class="row-hover${node.telemetry_stale ? ' table-warning' : ''}">
                <td class="text-center">${checkboxHtml}</td>
                <td data-label="Identity">
                    <div class="d-flex align-items-start justify-content-between gap-2 mb-1">
                        <div class="font-weight-bold text-dark text-truncate" style="font-size: 1.05rem; cursor: pointer;"
                            onclick="openIdentityModal('${node.mac}', '${safeHost}', '${node.description || ''}')" title="Click to edit identity">
                            <i class="fas fa-edit small text-primary" style="opacity: 0.6;"></i> ${node.hostname}
                        </div>
                        ${renderCollapseToggleButton(node.mac, false)}
                    </div>
                    <div class="text-muted small text-truncate mb-2" style="font-size: 0.82rem;">${node.description ? node.description : '<span style="opacity:0.5; font-style: italic;">Enter description...</span>'}</div>
                    <div class="text-muted hw-detail" style="font-family: monospace; font-size: 0.75rem;"><i class="fas fa-microchip"></i> MAC: ${node.mac}</div>
                    <div class="text-muted hw-detail" style="font-family: monospace; font-size: 0.75rem;"><i class="fas fa-network-wired"></i> IP: ${node.ip}</div>
                    ${staleBadge}
                </td>
                <td data-label="Experiment Status">${jobHtml}</td>
                <td data-label="Hardware &amp; State">
                    <div class="row hw-detail" style="font-size: 0.85rem;">
                        <div class="col-6 mb-2"><div class="text-muted small text-uppercase" style="font-size: 0.65rem;">Cameras</div>${renderCameraCellSummary(node, jobDetail)}</div>
                        <div class="col-6 mb-2"><div class="text-muted small text-uppercase" style="font-size: 0.65rem;">Hardware</div><div class="text-primary font-weight-bold"><i class="fas fa-microchip"></i> ${node.hardware_desc || 'Unknown'}</div></div>
                        <div class="col-6 mb-2"><div class="text-muted small text-uppercase" style="font-size: 0.65rem;">Storage</div><div class="${storageWarn ? 'text-danger font-weight-bold' : 'text-dark'}"><i class="fas fa-hdd"></i> ${node.storage_pct}% Used</div></div>
                        <div class="col-6 mb-2"><div class="text-muted small text-uppercase" style="font-size: 0.65rem;">Lights</div><div class="${lightsColorClass}"><i class="fas fa-lightbulb"></i> ${formatLightsLabel(node)}</div></div>
                        <div class="col-6 mb-2"><div class="text-muted small text-uppercase" style="font-size: 0.65rem;">Last Picture</div><div class="text-dark"><i class="fas fa-history"></i> ${node.last_pic_time}</div></div>
                        <div class="col-6 mb-2"><div class="text-muted small text-uppercase" style="font-size: 0.65rem;">System Clock</div><div>${timeBadge}</div></div>
                        <div class="col-6 mb-2"><div class="text-muted small text-uppercase" style="font-size: 0.65rem;">Network Sync</div><div>${syncHtml}</div></div>
                        <div class="col-6 mb-2"><div class="text-muted small text-uppercase" style="font-size: 0.65rem;">System Uptime</div><div>${uptimeHtml}</div></div>
                        <div class="col-12 mt-1 pt-2 border-top">
                            <div class="row">
                                <div class="col-6 d-flex align-items-center">
                                    <span class="text-muted small text-uppercase me-2" style="margin-right: 8px;">Hardware Lock:</span>
                                    <div>${lockHtml}</div>
                                </div>
                                <div class="col-6">${renderAttentionIssues(node)}</div>
                            </div>
                        </div>
                    </div>
                </td>
                <td data-label="Node Actions">
                    <div class="d-flex flex-column gap-2">
                        <button onclick="window.location.href = '/remote/${node.mac}'" class="btn btn-sm btn-light border shadow-sm text-primary w-100 justify-content-start"><div style="width: 24px; text-align: center;"><i class="fas fa-desktop"></i></div> Remote View</button>
                        <button onclick="runSingleDiagnostic('${node.mac}', '${safeHost}')" class="btn btn-sm btn-light border shadow-sm text-warning w-100 justify-content-start"><div style="width: 24px; text-align: center;"><i class="fas fa-stethoscope"></i></div> Diagnostic</button>
                        <button onclick="openConfigModal('${node.mac}', '${rawHost}')" class="btn btn-sm btn-light border shadow-sm text-dark w-100 justify-content-start"><div style="width: 24px; text-align: center;"><i class="fas fa-cog"></i></div> Edit Config</button>
                        <button onclick="rebootSingleNode('${node.mac}', '${safeHost}')" class="btn btn-sm btn-outline-danger w-100 justify-content-start"><div style="width: 24px; text-align: center;"><i class="fas fa-power-off"></i></div> Reboot Node</button>
                        <button onclick="showHistory('${node.mac}', '${safeHost}', '${node.ip}')" class="btn btn-sm btn-light border shadow-sm text-secondary w-100 justify-content-start"><div style="width: 24px; text-align: center;"><i class="fas fa-history"></i></div> Experiment History</button>
                        <button onclick="triggerSingleSync('${node.mac}', '${safeHost}')" class="btn btn-sm btn-light border shadow-sm text-info w-100 justify-content-start" ${syncData.is_syncing ? 'disabled' : ''}><div style="width: 24px; text-align: center;"><i class="fas fa-cloud-upload-alt"></i></div> Launch Sync</button>
                        ${syncData.is_syncing ? `<button onclick="cancelSingleSync('${node.mac}', '${safeHost}')" class="btn btn-sm btn-outline-danger w-100 justify-content-start mt-1"><div style="width: 24px; text-align: center;"><i class="fas fa-times"></i></div> Abort Transfer</button>` : ''}
                    </div>
                </td>
            </tr>`;
    }

    function renderOnlineRowCollapsed(node, checkboxHtml) {
        const safeHost = (node.hostname || '').replace(/'/g, "\\'");
        const desc = node.description ? node.description : '<span style="opacity:0.5; font-style: italic;">No description</span>';
        const jobDetail = node.job_detail || {};
        const camsClass = cameraBadgeClass(node);
        const storageClass = node.storage_pct > 85 ? 'bg-danger' : (node.storage_pct > 70 ? 'bg-warning text-dark' : 'bg-primary');
        const lightsBadge = `<span class="badge ${healthBadgeClass(node.lights_health || 'UNKNOWN')}">${formatLightsLabel(node)}</span>`;
        const uptimeValue = node.uptime && node.uptime !== 'Unknown' ? node.uptime : 'Unknown';
        const uptimeClass = uptimeValue === 'Unknown' ? 'bg-secondary' : 'bg-dark';
        const uptimeBadge = `<span class="badge ${uptimeClass}">Uptime ${uptimeValue}</span>`;
        const attentionBadge = renderAttentionBadge(node);

        const statusColor = node.job_status === 'ERROR'
            ? 'bg-danger'
            : (node.has_job ? 'bg-primary' : 'bg-secondary');
        const statusLabel = node.is_diagnosing
            ? 'DIAGNOSING'
            : (node.job_status || 'IDLE');
        const jobLabel = node.has_job ? (node.job_name || 'Active job') : 'System Idle';
        const jobLine = renderCollapsedJobLine(node);
        const roundFailBadge = jobDetail.last_capture_result === 'FAIL'
            ? '<span class="badge bg-danger ms-1">Round FAIL</span>'
            : '';

        return `
            <tr class="row-hover${node.telemetry_stale ? ' table-warning' : ''}">
                <td class="text-center">${checkboxHtml}</td>
                <td data-label="Identity">
                    <div class="d-flex align-items-start justify-content-between gap-2">
                        <div class="font-weight-bold text-dark text-truncate" style="font-size: 0.98rem; cursor: pointer;"
                            onclick="openIdentityModal('${node.mac}', '${safeHost}', '${node.description || ''}')" title="Click to edit identity">
                            <i class="fas fa-edit small text-primary" style="opacity: 0.6;"></i> ${node.hostname}
                        </div>
                        ${renderCollapseToggleButton(node.mac, true)}
                    </div>
                    <div class="text-muted small text-truncate">${desc}</div>
                    <div class="text-muted" style="font-family: monospace; font-size: 0.72rem;">${node.mac} | ${node.ip}</div>
                </td>
                <td style="width: 20%;" data-label="Experiment Status">
                    <div class="d-flex flex-column align-items-start gap-1">
                        <div class="d-flex align-items-center gap-1 flex-wrap">
                            <span class="text-muted small text-truncate" title="${jobLabel}" style="max-width: 130px;">${jobLabel}</span>
                            <span class="badge ${statusColor}">${statusLabel}</span>
                            ${roundFailBadge}
                        </div>
                        <span class="text-muted small text-truncate" style="max-width: 260px;" title="${jobLine}">${jobLine}</span>
                    </div>
                </td>
                <td data-label="Hardware &amp; State">
                    <div class="d-flex flex-wrap gap-1 align-items-center">
                        <span class="badge ${camsClass}">${node.cams_ok}/${node.cams_total} Cams</span>
                        <span class="badge ${storageClass}">${node.storage_pct}% Storage</span>
                        ${lightsBadge}
                        ${uptimeBadge}
                        ${attentionBadge}
                    </div>
                </td>
                <td data-label="Node Actions">
                    <button onclick="window.location.href = '/remote/${node.mac}'" class="btn btn-sm btn-light border shadow-sm text-primary w-100 justify-content-start">
                        <div style="width: 24px; text-align: center;"><i class="fas fa-desktop"></i></div> Remote View
                    </button>
                </td>
            </tr>`;
    }

    // --- DATA RENDERING ---
    async function fetchFleetData() {
        try {
            const response = await fetch('/api/fleet/live-digested', { cache: 'no-store' });
            let rawData = await response.json();

            let nodesList = Array.isArray(rawData) ? rawData : (rawData.nodes || []);
            let masterTime = rawData.master_time || "N/A";

            if (document.getElementById('last-sync-time')) {
                document.getElementById('last-sync-time').innerHTML = `
                    <span class="text-muted me-3" style="margin-right: 15px;">Last scan: ${new Date().toLocaleTimeString()}</span>
                    <span class="badge bg-primary text-white px-2 py-1 shadow-sm"><i class="fas fa-server"></i> Master Time: ${masterTime}</span>
                `;
            }

            let counts = { 'ALL': 0, 'RUNNING': 0, 'IDLE': 0, 'OFFLINE': 0, 'ATTENTION': 0 };
            let html = '';

            let hideToggle = document.getElementById('hideOfflineToggle');
            let hideOffline = hideToggle ? hideToggle.checked : false;
            const searchQuery = normalizeSortText(currentDescriptionQuery);

            nodesList = sortFleetNodes(nodesList);
            lastFleetNodeMacs = nodesList.map(node => node.mac);

            nodesList.forEach(node => {
                try {
                    counts['ALL']++;
                    if (counts[node.primary_state] !== undefined) counts[node.primary_state]++;
                    if (node.needs_attention) counts['ATTENTION']++;

                    if (hideOffline && !node.is_online) return;
                    if (currentView === 'ATTENTION' && !node.needs_attention) return;
                    if (currentView !== 'ALL' && currentView !== 'ATTENTION' && currentView !== node.primary_state) return;
                    if (searchQuery) {
                        const nodeName = normalizeSortText(node.hostname);
                        const nodeDesc = normalizeSortText(node.description);
                        if (!nodeName.includes(searchQuery) && !nodeDesc.includes(searchQuery)) return;
                    }

                    const isChecked = selectedMacs.has(node.mac) ? 'checked' : '';
                    const checkboxHtml = node.is_online
                        ? `<input type="checkbox" class="module-checkbox" value="${node.mac}" onclick="toggleSelection('${node.mac}')" ${isChecked}>`
                        : `<input type="checkbox" class="module-checkbox" disabled title="Cannot select offline modules">`;

                    const collapsed = isRowCollapsed(node.mac);
                    if (node.is_online) {
                        html += collapsed ? renderOnlineRowCollapsed(node, checkboxHtml) : renderOnlineRow(node, checkboxHtml);
                    } else {
                        html += collapsed ? renderOfflineRowCollapsed(node, checkboxHtml) : renderOfflineRow(node, checkboxHtml);
                    }
                } catch (rowErr) {
                    console.error('Row render error for', node.mac, rowErr);
                }
            });

            Object.keys(counts).forEach(key => {
                let badge = document.getElementById(`count-${key}`);
                if (badge) badge.innerText = counts[key];
            });

            if (document.getElementById('stat-total')) document.getElementById('stat-total').innerText = counts['ALL'];
            if (document.getElementById('stat-running')) document.getElementById('stat-running').innerText = counts['RUNNING'];
            if (document.getElementById('stat-errors')) document.getElementById('stat-errors').innerText = counts['ATTENTION'];

            document.getElementById('fleet-table-body').innerHTML = html || '<tr><td colspan="5" class="text-center py-5 text-muted"><i class="fas fa-info-circle fa-2x mb-3 text-secondary"></i><br>No modules match this view.</td></tr>';

            updatePollIntervalIfNeeded(nodesList.length);
        } catch (error) {
            console.error("Data fetch error", error);
        }
    }

    ensureFleetPolling();
    fetchFleetData();

    // --- NODE ACTIONS ---
    async function runSingleDiagnostic(mac, hostname) {
        const confirmed = await asyncConfirm('Confirm Diagnostic', `Run a hardware diagnostic scan on ${hostname}?`);
        if (!confirmed) return;
        
        try {
            await fetch(`/api/node/${mac}/diagnostic`, { method: 'POST' });
            showToast(`Diagnostic scan started on ${hostname}. Background tests will take a few minutes.`, 'success');
            fetchFleetData();
        } catch(e) { 
            showToast(`Failed to contact Master Controller to scan ${hostname}.`, 'danger'); 
        }
    }

    function openIdentityModal(mac, currentName, currentDesc) {
        document.getElementById('ident-mac').value = mac;
        document.getElementById('ident-name').value = currentName === "Unknown Node" ? "" : currentName;
        document.getElementById('ident-desc').value = currentDesc;
        
        new bootstrap.Modal(document.getElementById('identityModal')).show();
    }

    async function removeModuleFromFleet(mac, hostname) {
        const confirmed = await asyncConfirm(
            'Remove from Fleet',
            `Remove <strong>${hostname}</strong> from this commander?<br><small class="text-muted">Use when a module was moved to another chamber. Experiment history is preserved.</small>`
        );
        if (!confirmed) return;
        try {
            const res = await fetch(`/api/fleet/db/modules/${encodeURIComponent(mac)}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Delete failed');
            selectedMacs.delete(mac);
            document.getElementById('selected-count').innerText = selectedMacs.size;
            showToast(`${hostname} removed from fleet registry.`, 'success');
            fetchFleetData();
        } catch (e) {
            showToast('Failed to remove module from fleet.', 'danger');
        }
    }

    async function saveIdentity() {
        const mac = document.getElementById('ident-mac').value;
        const newName = document.getElementById('ident-name').value;
        const newDesc = document.getElementById('ident-desc').value;
        
        try {
            const res = await fetch(`/api/fleet/db/modules/${mac}/identity`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ alias: newName, description: newDesc })
            });
            
            if (!res.ok) throw new Error("Failed to save.");
            
            bootstrap.Modal.getInstance(document.getElementById('identityModal')).hide();
            fetchFleetData(); 
        } catch (e) {
            showToast("Failed to update module identity.", 'danger');
        }
    }

    async function executeBulk(action) {
        if (selectedMacs.size === 0) { 
            showToast("Select at least one module.", 'warning'); 
            return; 
        }
        
        const isDanger = action === 'REBOOT';
        let confirmMsg = `Send ${action} command to ${selectedMacs.size} modules?`;
        if (action === 'UPDATE') {
            confirmMsg = `Pull latest software on ${selectedMacs.size} modules? Nodes with new code will restart their service.`;
        }
        const confirmed = await asyncConfirm('Confirm Bulk Action', confirmMsg, isDanger);
        if (!confirmed) return;
        
        let endpoint = '';
        if (action === 'DIAGNOSTIC') endpoint = '/api/fleet/bulk/diagnostic';
        if (action === 'REBOOT') endpoint = '/api/fleet/bulk/reboot';
        if (action === 'TIME_SYNC') endpoint = '/api/fleet/bulk/time_sync_manual'; 
        if (action === 'SYNC') endpoint = '/api/fleet/bulk/sync/trigger';
        if (action === 'UPDATE') endpoint = '/api/fleet/bulk/update';

        const buttons = document.querySelectorAll('.bulk-action-bar button');
        buttons.forEach(b => b.disabled = true);

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target_macs: Array.from(selectedMacs) })
            });
            const result = await response.json();
            showToast(result.message || `${action} broadcast complete.`, response.ok ? 'success' : 'danger');
            
        } catch(e) { 
            showToast("Action failed to execute.", 'danger');
        } finally {
            buttons.forEach(b => b.disabled = false);
            selectedMacs.clear();
            if(document.getElementById('selected-count')) document.getElementById('selected-count').innerText = "0";
            if(document.getElementById('selectAll')) document.getElementById('selectAll').checked = false;
            fetchFleetData();
        }
    }

    async function rebootSingleNode(mac, hostname) {
        const confirmed = await asyncConfirm('Confirm Reboot', `Are you absolutely sure you want to forcefully reboot ${hostname}?`, true);
        if (!confirmed) return;
        
        try {
            await fetch(`/api/node/${mac}/reboot`, { method: 'POST' });
            showToast(`Reboot command sent to ${hostname}. It will drop offline momentarily.`, 'warning');
            fetchFleetData();
        } catch(e) { 
            showToast(`Failed to contact Master Controller to reboot ${hostname}.`, 'danger'); 
        }
    }

    // --- SYNC ACTIONS ---
    async function triggerSingleSync(mac, hostname) {
        const confirmed = await asyncConfirm('Confirm Sync', `Trigger an immediate network transfer on ${hostname}?`);
        if (!confirmed) return;
        
        try {
            const response = await fetch(`/api/fleet/bulk/sync/trigger`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target_macs: [mac] })
            });
            
            const result = await response.json();
            const nodeResult = result.results.find(r => r.mac === mac);
            
            if (nodeResult && nodeResult.status === 'success') {
                showToast(`Sync queued on ${hostname}.`, 'success');
            } else {
                showToast(nodeResult?.data?.error || `Failed to trigger sync. Check config.`, 'danger');
            }
            fetchFleetData();
        } catch(e) { 
            showToast(`Failed to reach Master Controller.`, 'danger'); 
        }
    }

    async function cancelSingleSync(mac, hostname) {
        const confirmed = await asyncConfirm('Confirm Abort', `Are you sure you want to kill the active network transfer on ${hostname}?`, true);
        if (!confirmed) return;
        
        try {
            await fetch(`/api/fleet/bulk/sync/cancel`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target_macs: [mac] })
            });
            showToast(`Abort signal sent to ${hostname}.`, 'warning');
            fetchFleetData();
        } catch(e) { 
            showToast(`Failed to abort sync.`, 'danger'); 
        }
    }

    async function showHistory(mac, hostname, ip) {
        document.getElementById('hist-hostname').innerText = hostname;
        document.getElementById('hist-runs-body').innerHTML = '<tr><td colspan="5" class="text-center py-3"><i class="fas fa-spinner fa-spin"></i></td></tr>';
        
        if(typeof bootstrap !== 'undefined') {
            new bootstrap.Modal(document.getElementById('historyModal')).show();
        }

        try {
            const res = await fetch(`/api/fleet/db/modules/${mac}/history`);
            const data = await res.json();
            
            let rHtml = '';
            data.runs.forEach(r => {
                let n_col = r.status === 'ERROR' ? 'text-danger' : (r.status === 'FINISHED' ? 'text-success' : 'text-primary');
                let link = r.local_exp_id 
                    ? `<button onclick="window.location.href = '/remote/${mac}?dest=exp/${r.local_exp_id}'" class="btn btn-xs btn-outline-info py-0 px-2" style="font-size: 0.75rem;"><i class="fas fa-desktop"></i> View in Proxy</button>` 
                    : `<span class="text-muted small">-</span>`;
                    
                let timeLine = r.start ? `${r.start.substring(5,16)}<br>${r.end.substring(5,16)}` : 'Unknown';
                let msgHtml = r.message ? `<br><small class="text-danger font-italic">${r.message}</small>` : '';

                rHtml += `
                <tr>
                    <td class="small text-muted" style="line-height: 1.2;">${timeLine}</td>
                    <td><span class="font-weight-bold text-dark">${r.name}</span>${msgHtml}</td>
                    <td class="${n_col} font-weight-bold small">${r.status}</td>
                    <td class="small">${r.taken}/${r.expected} <span class="text-danger">${r.missed > 0 ? `(-${r.missed})` : ''}</span></td>
                    <td class="small">${link}</td>
                </tr>`;
            });
            
            document.getElementById('hist-runs-body').innerHTML = rHtml || '<tr><td colspan="5" class="text-center text-muted py-3">No experiments recorded.</td></tr>';

        } catch(e) {
            document.getElementById('hist-runs-body').innerHTML = '<tr><td colspan="5" class="text-danger text-center py-3">Failed to load data.</td></tr>';
        }
    }
</script>
