<div class="modal fade" id="configModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content shadow">
      
      <div class="modal-header bg-dark text-white border-0 py-3">
        <h5 class="modal-title" id="config-modal-title"><i class="fas fa-cogs"></i> System Configuration</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body bg-light">
        <div id="cfg-alert-container"></div>
        <input type="hidden" id="cfg-target-macs">

        <div class="alert alert-warning py-2 small mb-4 border-warning shadow-sm" id="cfg-bulk-warning" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i> <strong>Bulk Edit Mode:</strong> Only fields you explicitly change will be updated. Blank fields are ignored. Hardware topology is strictly read-only and managed on-device.
        </div>

        <form id="config-form">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <div class="card shadow-sm border-0 border-left-info">
                        <div class="card-header bg-white py-2 font-weight-bold"><i class="fas fa-cloud-upload-alt text-info"></i> Automated Background Sync (Rclone)</div>
                        <div class="card-body bg-white py-3">
                            <div class="row">
                                <div class="col-md-4 form-group mb-3">
                                    <label class="small text-muted text-uppercase font-weight-bold mb-1">Sync Status</label>
                                    <select class="form-control form-control-sm cfg-input" id="cfg-SYNC_ENABLED">
                                        <option value="">-- No Change --</option>
                                        <option value="true">Enabled</option>
                                        <option value="false">Disabled</option>
                                    </select>
                                </div>
                                <div class="col-md-4 form-group mb-3">
                                    <label class="small text-muted text-uppercase font-weight-bold mb-1">Protocol Type</label>
                                    <select class="form-control form-control-sm cfg-input" id="cfg-remote_type">
                                        <option value="">-- No Change --</option>
                                        <option value="local">Local Drive</option>
                                        <option value="sftp">SSH - SFTP</option>
                                        <option value="ftp">FTP</option>
                                    </select>
                                </div>
                                <div class="col-md-4 form-group mb-3">
                                    <label class="small text-muted text-uppercase font-weight-bold mb-1">Interval (Mins)</label>
                                    <input type="number" class="form-control form-control-sm cfg-input" id="cfg-SYNC_INTERVAL" placeholder="e.g. 60" min="1">
                                </div>
                            </div>
                            
                            <div class="bg-light p-3 rounded border">
                                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-1">
                                    <h6 class="small text-muted font-weight-bold mb-0">Network Credentials (SFTP / FTP)</h6>
                                    <button type="button" class="btn btn-sm btn-outline-info font-weight-bold" onclick="runConfigTest()" id="btn-test-cfg">
                                        <i class="fas fa-network-wired"></i> Test Connection
                                    </button>
                                </div>
                                <div class="row">
                                    <div class="col-md-8 form-group mb-2">
                                        <label class="small font-weight-bold mb-1">Host / IP</label>
                                        <input type="text" class="form-control form-control-sm cfg-input" id="cfg-host" placeholder="192.168.1.100">
                                    </div>
                                    <div class="col-md-4 form-group mb-2">
                                        <label class="small font-weight-bold mb-1">Port</label>
                                        <input type="number" class="form-control form-control-sm cfg-input" id="cfg-port" placeholder="22">
                                    </div>
                                    <div class="col-md-6 form-group mb-2">
                                        <label class="small font-weight-bold mb-1">Username</label>
                                        <input type="text" class="form-control form-control-sm cfg-input" id="cfg-user" placeholder="admin">
                                    </div>
                                    <div class="col-md-6 form-group mb-2">
                                        <label class="small font-weight-bold mb-1">Password</label>
                                        <input type="password" class="form-control form-control-sm cfg-input" id="cfg-password" placeholder="Leave blank to keep existing">
                                    </div>
                                    <div class="col-md-12 form-group mb-0 mt-2">
                                        <label class="small font-weight-bold mb-1">Destination Target Path</label>
                                        <input type="text" class="form-control form-control-sm cfg-input" id="cfg-destination_path" placeholder="/var/backups/chronoroot">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-12">
                     <div class="card shadow-sm border-0 border-left-secondary">
                        <div class="card-header bg-white py-2 font-weight-bold"><i class="fas fa-globe"></i> System Time & NTP</div>
                        <div class="card-body bg-white py-3">
                            <div class="row align-items-end">
                                <div class="col-md-4 form-group mb-0">
                                    <label class="small text-muted text-uppercase font-weight-bold mb-1">Time Mode</label>
                                    <select class="form-control form-control-sm cfg-input" id="cfg-USE_NTP">
                                        <option value="">-- No Change --</option>
                                        <option value="true">Auto (NTP)</option>
                                        <option value="false">Manual (Master Sync)</option>
                                    </select>
                                </div>
                                <div class="col-md-4 form-group mb-0">
                                    <label class="small text-muted text-uppercase font-weight-bold mb-1">Time Zone</label>
                                    <input type="text" class="form-control form-control-sm cfg-input" id="cfg-TIME_ZONE" placeholder="e.g. Europe/Paris">
                                </div>
                                <div class="col-md-4 form-group mb-0">
                                    <label class="small text-muted text-uppercase font-weight-bold mb-1">NTP Server (Optional)</label>
                                    <input type="text" class="form-control form-control-sm cfg-input" id="cfg-NTP_SERVER" placeholder="e.g. ntp.u-psud.fr">
                                </div>
                            </div>
                        </div>
                     </div>
                </div>

            </div>
        </form>

      </div>
      <div class="modal-footer border-0 bg-white py-3">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-dark font-weight-bold px-4" onclick="submitConfiguration()" id="btn-save-cfg">
            <i class="fas fa-paper-plane"></i> Dispatch to Fleet
        </button>
      </div>
    </div>
  </div>
</div>

<script>
    async function openConfigModal(mac = null, hostname = null) {
        document.getElementById('config-form').reset();
        document.getElementById('cfg-alert-container').innerHTML = '';
        let targetMacs = [];
        
        if (mac) {
            targetMacs = [mac];
            document.getElementById('config-modal-title').innerHTML = `<i class="fas fa-cog"></i> Config: ${hostname}`;
            document.getElementById('cfg-bulk-warning').style.display = 'none';
            
            const btn = document.getElementById('btn-save-cfg');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Fetching...';
            new bootstrap.Modal(document.getElementById('configModal')).show();
            
            try {
                const res = await fetch(`/api/node/${mac}/config`);
                const data = await res.json();
                if(data.TIME_ZONE) document.getElementById('cfg-TIME_ZONE').value = data.TIME_ZONE;
                if(data.NTP_SERVER) document.getElementById('cfg-NTP_SERVER').value = data.NTP_SERVER; 
                if(data.USE_NTP !== undefined) document.getElementById('cfg-USE_NTP').value = data.USE_NTP ? "true" : "false"; 
                if(data.SYNC_INTERVAL) document.getElementById('cfg-SYNC_INTERVAL').value = data.SYNC_INTERVAL;
                if(data.SYNC_REMOTE_TYPE) document.getElementById('cfg-remote_type').value = data.SYNC_REMOTE_TYPE;
                if(data.SYNC_ENABLED !== undefined) document.getElementById('cfg-SYNC_ENABLED').value = data.SYNC_ENABLED ? "true" : "false";
                
            } catch (e) {
                document.getElementById('cfg-alert-container').innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Dispatch to Fleet';
            }
        } else {
            if(selectedMacs.size === 0) { 
                showToast("Select modules first.", "warning"); 
                return; 
            }
            targetMacs = Array.from(selectedMacs);
            document.getElementById('config-modal-title').innerHTML = `<i class="fas fa-layer-group"></i> Bulk Config (${targetMacs.length} Nodes)`;
            document.getElementById('cfg-bulk-warning').style.display = 'block';
            new bootstrap.Modal(document.getElementById('configModal')).show();
        }
        document.getElementById('cfg-target-macs').value = JSON.stringify(targetMacs);
    }

    async function submitConfiguration() {
        const btn = document.getElementById('btn-save-cfg');
        const box = document.getElementById('cfg-alert-container');
        const payload = { target_macs: JSON.parse(document.getElementById('cfg-target-macs').value) };
        
        const fields = ['TIME_ZONE', 'NTP_SERVER', 'SYNC_INTERVAL', 'remote_type', 'host', 'port', 'user', 'password', 'destination_path'];
        fields.forEach(f => {
            let val = document.getElementById('cfg-' + f).value.trim();
            if (val) payload[f] = (f === 'SYNC_INTERVAL' || f === 'port') ? parseInt(val) : val;
        });

        let syncE = document.getElementById('cfg-SYNC_ENABLED').value;
        if(syncE) payload.SYNC_ENABLED = (syncE === "true");

        let useNTP = document.getElementById('cfg-USE_NTP').value;
        if(useNTP) payload.USE_NTP = (useNTP === "true");

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Broadcasting...';
        box.innerHTML = '';

        try {
            const res = await fetch('/api/fleet/bulk/config', {
                method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.status === "complete") {
                box.innerHTML = `<div class="alert alert-success">Config dispatch complete. Modules are restarting.</div>`;
                setTimeout(() => { bootstrap.Modal.getInstance(document.getElementById('configModal')).hide(); }, 1500);
            } else {
                box.innerHTML = `<div class="alert alert-warning">Partial failure occurred. Check console.</div>`;
            }
        } catch(e) {
             box.innerHTML = `<div class="alert alert-danger">Network error: ${e.message}</div>`;
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Dispatch to Fleet';
        }
    }

    async function runConfigTest() {
        const btn = document.getElementById('btn-test-cfg');
        const targetMacsStr = document.getElementById('cfg-target-macs').value;
        
        if (!targetMacsStr) {
            showToast("No modules selected to test.", "info");
            return;
        }
        
        const targetMacs = JSON.parse(targetMacsStr);

        const connectionData = {
            remote_type: document.getElementById('cfg-remote_type').value,
            host: document.getElementById('cfg-host').value.trim(),
            port: parseInt(document.getElementById('cfg-port').value) || null,
            user: document.getElementById('cfg-user').value.trim(),
            password: document.getElementById('cfg-password').value
        };

        if (!connectionData.remote_type || connectionData.remote_type === 'local') {
            showToast("Testing is only available for SFTP/FTP connections. Ensure 'Protocol Type' is selected.", "info");
            return;
        }
        if (!connectionData.host || !connectionData.user) {
            showToast("Host and Username are required to run a test.", "info");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Testing...';

        // Calls the global testSyncConnection function defined in _table_fleet.html
        if (typeof testSyncConnection === 'function') {
            await testSyncConnection(targetMacs, connectionData);
        } else {
            showToast("Error: testSyncConnection function not found.", "info");
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-network-wired"></i> Test Connection';
    }

    async function testSyncConnection(macsArray, connectionData) {
        try {
            const response = await fetch(`/api/fleet/bulk/sync/test`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    target_macs: macsArray,
                    ...connectionData
                })
            });
            
            const result = await response.json();
            let successCount = 0;
            let errors = [];
            
            result.results.forEach(res => {
                if (res.status === 'success') successCount++;
                else errors.push(`[${res.mac}] ${res.data?.error || res.message}`);
            });
            
            if (errors.length > 0) {
                showToast(`Test Failed on ${errors.length} nodes:\n\n${errors.join('\n')}`, "info");
                return false;
            } else {
                showToast(`Connection successful on all ${successCount} nodes! You can now save.`, "info");
                return true;
            }
        } catch(e) {
            showToast("Network failure trying to run test.", "info");
            return false;
        }
    }
</script>
